<div class="map__tags" #container>
  @for (category of categories(); track category.lkMapCategory) {
    <lib-map-tag
     [category]="category"
     class="map-thumbnail__item"
     (tagClick)="tagClick.emit(tag)"
     />
  }
  @if (hasRemainingTags()) {
    <lib-map-tags-remaining
      [remainingTags]="remainingTags()"
      (click)="onRemainingTagsClick($event)"
      class="map-thumbnail__item"
    />
  }
  @if (isEmpty()) {
    <span class="muted-text">
      There are no tags yet.
    </span>
  }
  @if (shouldShowAddButton()) {
    <lib-add-button
      class="map__add-button"
      [type]="'tag'"
      [shouldShow]="shouldShowAddButton()"
      />
  }

</div>
