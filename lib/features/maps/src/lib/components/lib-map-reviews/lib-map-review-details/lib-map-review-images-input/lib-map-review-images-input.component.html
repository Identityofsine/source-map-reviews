<div class="map-review-images-input">
  <div class="map-review-images-input__images">
    @if (images().length <= 0) {
     <p class="empty-text">
      No images added.
      </p>
      } @else {
      <div class="map-review-images-input__images-list">
        @for (image of images(); track image.mapImageId) {
        <lib-map-review-images-input-thumbnail
         [mapImage]="image" />
        }
      </div>
      }
  </div>
  <div class="map-review-images-input__absolute_add">
    <lib-add-button
     [shouldShow]="true"
     (click)="openAddImage()">
    </lib-add-button>
  </div>
</div>
