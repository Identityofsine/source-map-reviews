@if (shouldShow()) {
<button
 class="add-button"
 [class.tag]="type() === 'tag'"
 (click)="onAddButtonClick($event)"
 >
  <div class="add-icon">
    <arch-icon
     class="add-icon"
     src="/ui/plus.svg"></arch-icon>
  </div>
  @if (type() != 'tag') {
    <span class="add">Add</span>
  }
</button>
}
