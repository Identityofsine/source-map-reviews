<div class="map-search-container">
  <arch-map-search-query />

  @if (search.error()) {
    <p-message severity="error">
      Failed to load maps. Please try again.
      <button (click)="search.reload()" class="ml-2 underline">Retry</button>
    </p-message>
  } @else if (maps()?.length > 0) {
    <arch-paginated-list
      [data]="maps()"
      [itemsPerPage]="12"
      [showPageInput]="true"
      [showPageInfo]="true"
      [loading]="search.isLoading()"
      layout="grid"
      [gridColumns]="'repeat(auto-fill, minmax(280px, 1fr))'">
      <ng-template #itemTemplate let-map>
        <lib-map-thumbnail
          [map]="map"
        />
      </ng-template>
    </arch-paginated-list>
  } @else if(maps()?.length <= 0 && isDirty()) {
    <p-message severity="error">
      No maps found for the given search query. Please try again with different keywords.
    </p-message>
  }
</div>
