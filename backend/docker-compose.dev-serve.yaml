version: '3.8'

networks:
  de_archive_dev_net:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
    # Enable network isolation
    internal: false
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

services:
  api:
    container_name: de_archive-backend-dev-serve
    environment:
      - GO_ENV=development
      - URI=https://de-archive.com/api
      - DOMAIN=localhost
      - FRONTEND_URI=https://de-archive.com
      - PORT=3001
      # Database connection environment variables
      - DB_USER=docker
      - DB_PASSWORD=docker
      - DB_NAME=app
    networks:
      de_archive_dev_net:
        ipv4_address: 172.28.0.20
    ports:
      # Bind only to localhost/specific IP - replace 127.0.0.1 with your machine's IP if needed
      - "127.0.0.1:7543:3001"
    volumes:
      # Mount the .env file so the application can read it
      - ./.env:/app/.env:ro
    # Security improvements
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    # Restart policy
    restart: unless-stopped
    
  db:
    container_name: de_archive-db-dev-serve
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
    networks:
      de_archive_dev_net:
        ipv4_address: 172.28.0.21
    ports:
      # ONLY bind to localhost - never expose DB to external network
      - "15432:5432"  # Optional: bind to a specific IP -- local network
    volumes:
      - de_archive-dev-serve:/var/lib/postgresql/data:Z  # SELinux context
    # Security improvements for database
    user: "999:999"  # PostgreSQL user
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    # Add health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d app"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  de_archive-dev-serve:
