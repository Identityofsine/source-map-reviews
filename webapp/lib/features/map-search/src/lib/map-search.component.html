<div class="map-search-container">
  <arch-modal [open]='true'>
    <h2>mimi</h2>
  </arch-modal>


  <arch-map-search-query />
    @if (maps()) {
    <div class="maps">
      @for (map of maps(); track map.mapName) {
        <lib-map-thumbnail
          [mapName]="map.mapName"
          [mapTags]="map.mapTags"
        />
      }
    </div>
  }
</div>
