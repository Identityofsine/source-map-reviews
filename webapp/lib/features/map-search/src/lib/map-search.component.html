<div class="map-search-container">
  <arch-map-search-query />

  @if (maps()) {
    <arch-paginated-list
      [data]="maps()"
      [itemsPerPage]="12"
      [showPageInput]="true"
      [showPageInfo]="true"
      layout="grid"
      [gridColumns]="'repeat(auto-fill, minmax(280px, 1fr))'">
      <ng-template #itemTemplate let-map>
        <lib-map-thumbnail
          [map]="map"
        />
      </ng-template>
    </arch-paginated-list>
  }
</div>
