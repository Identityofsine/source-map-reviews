<div class="map">
  @if (map()) {
  <lib-map-header
   [mapName]="map().mapName"
   [mapTags]="map().mapTags" />
  <div class="map__container">
    <lib-map-gallery
    [mapName]="map().mapName"
    [mapImages]="mapImages()"
    ></lib-map-gallery>
    <lib-map-reviews
    [reviews]="reviews()"
    ></lib-map-reviews>
  </div>
  }
</div>
