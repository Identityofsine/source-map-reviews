<button
 class="map-review"
 (click)="onReviewClick.emit(review())">
  <div class="map-review__title">
    <h3>
      shm^xy
    </h3>
    <p class="map-review__subtitle">
      {{ review().updatedAt | date: 'short' }}
    </p>
    <div class="map-review__reviews">
      <reviews-component
       [readOnly]="true"
       [reviewScore]="review().stars">
      </reviews-component>
    </div>
  </div>
  <div class="map-review__content">
    <p class="map-review__text">
      {{ review().review }}
    </p>
  </div>
  <div class="map-review__footer">
    <button
     class="wrapper"
     (click)="$event.stopPropagation(); onReviewExpand.emit(review())">
      <span class="map-review__likes">
        See More
      </span>
      <arch-icon
       src="/ui/right-chevron.svg" />
    </button>
  </div>
</button>
