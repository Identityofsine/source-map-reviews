<arch-modal
 [open]="true">

  <div modal-title>
    <h2>
      @if (review()) {
      shm^xy's Review
      } @else {
      Add Review
      }
    </h2>
  </div>
  <div modal-body class="map-review-details">
    <form [formGroup]="form">
      <div class="map-review-details__areatext">
        <arch-text-area
         class="review-text"
         formControlName="review"
         [placeholder]="review() ? '' : 'Write your review'"
         [readOnly]="!isEditing()"></arch-text-area>
      </div>
      <lib-map-review-input
        formControlName="stars"
        [readOnly]="!isEditing()"></lib-map-review-input>
    </form>
    <div class="map-review-button-row">
    @if (!isReadOnly()) {
      <button
        class="map-review-details__submit btn btn-confirm"
        (click)="onSubmit()"
        [disabled]="form.invalid">
          Save
      </button>
    }
    </div>

  </div>

</arch-modal>
